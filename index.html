<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ladder</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main>
      <h1>Ladder</h1>
      <select id="model" title="Model: mixture · size · params · training tokens"></select>
      <div id="examples">examples:</div>

      <div id="tokenbar" hidden>
        <input id="token" type="password" placeholder="Hugging Face token (hf_…), the repos are private" autocomplete="off" spellcheck="false" />
        <button id="token-save">Save</button>
      </div>

      <textarea id="text" spellcheck="false" placeholder="Type some text, then press Continue (⌘/Ctrl+Enter)."></textarea>

      <div class="controls">
        <button id="go" disabled>Continue</button>
        <button id="stop" hidden>Stop</button>
        <label>temperature <input id="temp" type="number" min="0" max="2" step="0.1" value="0.8" /></label>
        <label>tokens <input id="max" type="number" min="1" max="1000" step="1" value="32" /></label>
      </div>
      <div id="progress" hidden><div id="bar"></div></div>
      <div id="status"></div>
      <nav id="nav"><a href="./rl.html">live RL →</a> <a href="./interp.html">visualizer →</a></nav>
    </main>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
